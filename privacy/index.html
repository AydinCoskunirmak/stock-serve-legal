<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock &amp; Serve</title><link rel="icon" href="../favicon.png"><style>
:root{--bg:#FFF6E6;--card:#fff;--ink:#2B1D14;--muted:#7A6553;--red:#E85A49;--orange:#FFA41B;--line:#F0DEC2}
@media (prefers-color-scheme:dark){:root{--bg:#1E140D;--card:#2A1C12;--ink:#F7EBDD;--muted:#C2AB93;--line:#3E2C1E}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans JP","Noto Sans KR","Noto Sans SC",sans-serif}
header{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;padding:22px 16px}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand img{width:48px;height:48px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.brand b{font-size:20px;letter-spacing:.2px}
header h1{margin:16px 0 2px;font-size:28px;line-height:1.2}
header .upd{opacity:.9;font-size:14px}
main{padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px 14px}
h2{font-size:18px;margin:20px 0 6px}
p{margin:0 0 10px;overflow-wrap:anywhere}
a{color:var(--red)}
nav.langs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
nav.langs a{font-size:13px;text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--card)}
nav.langs a.on{background:var(--red);border-color:var(--red);color:#fff}
.switch{margin:0 0 16px;font-size:14px}
footer{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
ul.docs{list-style:none;padding:0;margin:0}ul.docs li{padding:10px 0;border-bottom:1px solid var(--line)}ul.docs li:last-child{border:0}
</style></head>
<body><script>(function(){var c=["en", "tr", "es", "pt", "de", "fr", "it", "ja", "ko", "ru", "zh-Hans"],l=(navigator.languages&&navigator.languages[0]||navigator.language||'en').toLowerCase(),p=l.split('-')[0],t=l.indexOf('zh')===0?'zh-Hans':(c.indexOf(p)>=0?p:'en');location.replace('./'+t+'/');})();</script><noscript><a href="en/">English</a></noscript></body></html>
